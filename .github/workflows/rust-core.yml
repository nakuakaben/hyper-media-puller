name: Rust core
on:
  push:
    branches: [feat/rust-v2-core]
    paths: ['v2/**', 'tests/fixtures/**', '.github/workflows/rust-core.yml']
  pull_request:
    paths: ['v2/**', 'tests/fixtures/**', '.github/workflows/rust-core.yml']
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Identify Windows test volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drive = [System.IO.Path]::GetPathRoot([System.IO.Path]::GetTempPath()).Substring(0, 1)
          Get-Volume -DriveLetter $drive | Select-Object DriveLetter, FileSystem
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Exercise disposable Windows volumes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked -p hmp-infra --example qualify_windows_volume
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./desktop/qualification/windows-storage.ps1 -Probe ./target/debug/examples/qualify_windows_volume.exe -Evidence ./desktop/windows-qualification
      - name: Upload Windows volume evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-storage-qualification
          path: v2/desktop/windows-qualification/storage.json
          if-no-files-found: ignore
  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
      - run: npm ci
      - run: npm run build:app
      - run: npm run test:ftp-paths
      - run: npm run test:characterization
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run tauri -- build --debug --no-bundle -- --locked
      - name: Ensure the Microsoft WebView2 Evergreen Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./qualification/windows-runtime.ps1
      - name: Exercise the native Windows WebView2 offload
        if: runner.os == 'Windows'
        run: node qualification/windows-webview2.mjs
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Upload Windows qualification evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-webview2-qualification
          path: v2/desktop/windows-qualification/
          if-no-files-found: ignore
