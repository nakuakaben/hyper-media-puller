name: Rust core
on:
  push:
    branches: [main, feat/rust-v2-core]
  # The six required checks must also run for documentation-only PRs.
  pull_request:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Optional age public key for encrypted Windows test installers'
        type: string
        required: false
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Identify Windows test volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drive = [System.IO.Path]::GetPathRoot([System.IO.Path]::GetTempPath()).Substring(0, 1)
          Get-Volume -DriveLetter $drive | Select-Object DriveLetter, FileSystem
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Exercise disposable Windows volumes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked -p hmp-infra --example qualify_windows_volume
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./desktop/qualification/windows-storage.ps1 -Probe ./target/debug/examples/qualify_windows_volume.exe -Evidence ./desktop/windows-qualification
      - name: Upload Windows volume evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-storage-qualification
          path: v2/desktop/windows-qualification/storage.json
          if-no-files-found: ignore
  electron:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
      - run: npm ci
      - run: npm run build:app
      - run: npm run test:ftp-paths
      - run: npm run test:characterization
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v2/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify public frontend excludes internal device images
        shell: bash
        run: |
          if find dist -type f -iname 'hyperdeck-*.png' | grep -q .; then
            echo 'The public frontend contains restricted device images.'
            exit 1
          fi
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build the native desktop
        if: runner.os != 'Windows'
        run: npm run tauri -- build --debug --no-bundle -- --locked
      - name: Build the Windows qualification executable
        if: runner.os == 'Windows'
        run: npm run tauri -- build --debug --no-bundle --features windows-qualification -- --locked
      - name: Ensure the Microsoft WebView2 Evergreen Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./qualification/windows-runtime.ps1
      - name: Exercise the native Windows WebView2 offload
        if: runner.os == 'Windows'
        run: node qualification/windows-webview2.mjs
      - name: Check the internal build in native Windows WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run tauri -- build --debug --no-bundle --config src-tauri/tauri.internal.conf.json --features windows-qualification -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qualification/windows-webview2.mjs src-tauri/target/debug/hmp-v2-preview.exe "$env:RUNNER_TEMP/hmp-internal-qualification" --internal
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build the normal Windows executable
        if: runner.os == 'Windows'
        run: npm run tauri -- build --debug --no-bundle -- --locked
      - name: Build and exercise the Windows beta installer
        if: runner.os == 'Windows' && (inputs.recipient != '' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, 'HMP-BETA-RECIPIENT=')))
        shell: pwsh
        env:
          HMP_RECIPIENT: ${{ inputs.recipient }}
          HMP_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          $recipient = $env:HMP_RECIPIENT
          if (-not $recipient) {
            $recipient = [regex]::Match($env:HMP_PR_BODY, '(?m)^HMP-BETA-RECIPIENT=(age1[0-9a-z]{58})\r?$').Groups[1].Value
          }
          ./qualification/windows-package.ps1 -Recipient $recipient -Variant standard
          ./qualification/windows-package.ps1 -Recipient $recipient -Variant internal
      - name: Upload encrypted Windows beta
        if: always() && runner.os == 'Windows' && (inputs.recipient != '' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.body, 'HMP-BETA-RECIPIENT=')))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-beta-encrypted
          path: ${{ runner.temp }}/hmp-beta-windows-*/windows-package.zip.age
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Windows qualification evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-webview2-qualification
          path: v2/desktop/windows-qualification/
          if-no-files-found: ignore
