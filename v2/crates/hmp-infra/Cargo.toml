[package]
name = "hmp-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hmp-domain.workspace = true
hmp-core.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "fs"] }
if-addrs = "=0.14.0"
sha2.workspace = true
tempfile.workspace = true
cap-std = "=3.4.5"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
fs2 = "=0.4.3"
same-file = "=1.0.6"

[dev-dependencies]
hmp-contract = { path = "../hmp-contract" }
serde_json.workspace = true

[[test]]
name = "safety"
path = "../../tests/safety.rs"

[lints]
workspace = true

[[test]]
name = "ftp_wire"
path = "../../tests/ftp_wire.rs"

[[test]]
name = "local_destination"
path = "../../tests/local_destination.rs"
