[package]
name = "hmp-v2-preview"
version = "0.1.0"
edition = "2024"

[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
async-trait = "=0.1.92"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "=1.18.1", features = ["v4"] }
tempfile = "=3.23.0"
tauri-plugin-dialog = "=2.8.4"
hmp-contract = { path = "../../crates/hmp-contract" }
hmp-core = { path = "../../crates/hmp-core" }
hmp-domain = { path = "../../crates/hmp-domain" }
hmp-infra = { path = "../../crates/hmp-infra" }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
