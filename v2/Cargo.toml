[workspace]
members = ["crates/hmp-domain", "crates/hmp-core", "crates/hmp-infra", "crates/hmp-contract"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
hmp-domain = { path = "crates/hmp-domain" }
hmp-core = { path = "crates/hmp-core" }
uuid = { version = "=1.18.1", features = ["v4"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "=0.1.92"
sha2 = "=0.10.9"
md-5 = "=0.10.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.23.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Keep the full-size FTP fixture practical while preserving debug checks in HMP.
[profile.test.package.sha2]
opt-level = 3
